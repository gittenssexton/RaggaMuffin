name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Verify source compiles
        run: python -m py_compile app.py
      - name: Build unpacked Windows app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name RaggaMuffin --collect-all bleak app.py
      - name: Create file hashes
        shell: pwsh
        run: |
          Get-ChildItem dist/RaggaMuffin -File -Recurse | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash)  $($_.Path.Substring((Resolve-Path 'dist/RaggaMuffin').Path.Length + 1))"
          } | Set-Content -Encoding utf8 dist/RaggaMuffin/SHA256SUMS.txt
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: RaggaMuffin-Windows-onedir
          path: dist/RaggaMuffin/
          if-no-files-found: error
