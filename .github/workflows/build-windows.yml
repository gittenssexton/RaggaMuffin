name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'app.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RaggaMuffin --collect-all bleak app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: RaggaMuffin-Windows
          path: dist/RaggaMuffin.exe
          if-no-files-found: error
